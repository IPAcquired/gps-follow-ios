[env:flight_team]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
extra_scripts = pre:build_privacy.py
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@6.21.5
  h2zero/NimBLE-Arduino@2.5.0
  ricmoo/QRCode@0.0.1
build_flags =
  -D UZLIB_CONF_PARANOID_CHECKS=1
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TOUCH_CS=33
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=6000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=0
  -D CONFIG_BT_NIMBLE_SM_SC_ONLY=1
  -D CONFIG_BT_NIMBLE_LOG_LEVEL=0
